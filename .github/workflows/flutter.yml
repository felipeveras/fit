name: Flutter foundation
on:
  workflow_dispatch:
  push:
    paths: ['app_flutter/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['app_flutter/**', '.github/workflows/flutter.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug
        working-directory: app_flutter/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-validation
          path: |
            app_flutter/build/app/outputs/flutter-apk/app-debug.apk
            app_flutter/build/app/reports/tests/
            app_flutter/build/app/reports/lint-results-debug.html
          if-no-files-found: warn
